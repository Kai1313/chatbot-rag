services:
  # 1. PostgreSQL Database Service (Port 5431 exposed for Navicat / HeidiSQL / DBeaver)
  db:
    image: postgres:16-alpine
    container_name: local_postgres
    restart: always
    environment:
      POSTGRES_DB: local_db
      POSTGRES_USER: local_user
      POSTGRES_PASSWORD: local_password
    ports:
      - "5431:5432"   # Port 5431 to avoid host collision
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_user -d local_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend Service (Port 8080 on host to avoid port 8000 collision)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: local_backend
    restart: always
    ports:
      - "8080:8000"   # Mapped to host port 8080
    environment:
      - DATABASE_URL=postgresql://local_user:local_password@db:5432/local_db
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - BASE_API_URL=${BASE_API_URL:-http://localhost:8080}
      - DATASET_PATH=${DATASET_PATH:-sample_dataset.xlsx}
      - TRACKING_SHEET=${TRACKING_SHEET:-}
      - KNOWLEDGE_SHEET=${KNOWLEDGE_SHEET:-}
    volumes:
      - ./data/chroma:/app/chroma_db
      - ./data/documents:/app/data/documents
      - ./:/app/data_source:ro
    depends_on:
      db:
        condition: service_healthy

  # 3. Next.js Mobile-First PWA Frontend Service (Port 3000)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: local_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  postgres_data:
